<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숲길 도주</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen game cabinet. HUD strip, sunlit top-down forest board, action tray; side rail (units, log) on wide screens.
   Palette follows obangsaek: blue = loyal retainers (A), red = restoration faction (B), yellow = the deposed royal, black = the usurper's troops. Single committed bright look. */
:root{
  --bg:#e6f2ee; --bg-2:#f4f9ee; --panel:#ffffff; --panel-2:#f1f7f2; --line:#d2e1d6; --fg:#1c2922; --muted:#5b6f64;
  --cheong:#2b6fb6; --cheong-l:#dbe9f7; --jeok:#cf3340; --jeok-l:#fbe1e3; --hwang:#f2b51d; --hwang-d:#b9850b; --heuk:#272c3d;
  --grass:#acd977; --grass-2:#9fd06b; --flower:#fff6c9;
  --can-d:#3d9148; --can-m:#57ab51; --can-l:#8ed16d; --blossom:#f4a2bf; --blossom-2:#fbd3e1; --trunk:#8a5a33;
  --bush:#3b8743; --bush-2:#4f9d4f; --berry:#e0404e;
  --rock:#c3ccd5; --rock-2:#97a3b1; --rock-3:#eef2f6;
  --road:#efd8a3; --road-2:#d4b271; --trailp:#dcecaa; --print:#a3bd69;
  --stone:#ddd6c8; --stone-2:#a69d8c; --wood:#bf7f45; --wood-2:#7a4d28;
  --bad:#e0443c; --ok:#2f9e57; --warn:#ef8a1a;
  --font-display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --font-story:'Gowun Batang','Nanum Myeongjo',serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg-2) 60%);background-color:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
button{font:inherit;color:inherit}
.app{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seal{width:34px;height:34px;border-radius:6px;background:var(--jeok);color:#fff;font-family:var(--font-story);font-weight:700;font-size:20px;display:grid;place-items:center;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px #ffffff55}
.logo{font-family:var(--font-display);font-size:28px;letter-spacing:.02em;color:var(--fg)}
.tag{color:var(--muted);font-size:12px;letter-spacing:.08em}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;box-shadow:0 1px 0 #0000000d}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--cheong);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--hwang);color:#2b1d00;border-color:var(--hwang-d);font-weight:700}
.btn.on{border-color:var(--cheong);box-shadow:inset 0 0 0 1px var(--cheong);background:var(--cheong-l)}
.btn.build.on{border-color:var(--jeok);box-shadow:inset 0 0 0 1px var(--jeok);background:var(--jeok-l)}
.btn kbd{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel)}
.btn.primary kbd{color:#2b1d00;border-color:#2b1d0040;background:transparent}
.btn .n{font-family:var(--font-mono);font-weight:600}
.btn .cost{font-family:var(--font-mono);font-size:11px;color:var(--jeok)}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hud .stage{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.hud .stage b{font-family:var(--font-display);font-size:19px;font-weight:400}
.hud .stage span{color:var(--muted);font-size:12px}
.stat{display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.08em}
.stat b{font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pip{width:12px;height:12px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--hwang)}
.pip.hp{border-radius:50%}
.pip.hp.on{background:var(--jeok)}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.msub{font-size:12.5px}
.msub b,.mrow b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.warn{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar .fill,.bar .ghost{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .25s}
.bar .ghost{background:color-mix(in srgb,var(--hwang) 35%,transparent)}
.bar .fill{background:var(--hwang)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--jeok)}
.boardwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--grass);box-shadow:0 6px 18px #2b4a3a1f}
.boardwrap.shake{animation:shake .35s}
.boardwrap.flash::after{content:"";position:absolute;inset:0;background:var(--bad);opacity:0;animation:flash .4s;pointer-events:none}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 24px);text-align:center;box-shadow:0 2px 8px #0000001a}
.toast.show{opacity:1}
.banner{position:absolute;left:0;right:0;top:10%;display:flex;justify-content:center;pointer-events:none;opacity:0}
.banner span{font-family:var(--font-display);font-size:clamp(20px,4vw,30px);padding:10px 22px;border-radius:12px;background:var(--panel);border:2px solid var(--fg);box-shadow:0 6px 0 var(--fg)}
.banner.red span{background:var(--jeok);color:#fff;border-color:#7d1720;box-shadow:0 6px 0 #7d1720}
.banner.blue span{background:var(--cheong);color:#fff;border-color:#163f6b;box-shadow:0 6px 0 #163f6b}
.banner.gold span{background:var(--hwang);color:#2b1d00;border-color:var(--hwang-d);box-shadow:0 6px 0 var(--hwang-d)}
.banner.show{animation:banner 1.5s ease-out forwards}
@keyframes banner{0%{opacity:0;transform:translateY(14px) scale(.92)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.turnpill{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--heuk);color:#fff;pointer-events:none}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-10px;width:8px;height:6px;border-radius:60% 40% 60% 40%;background:var(--blossom-2);opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,520px) rotate(540deg)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start}
.tray .group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tray .glabel{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.tray .glabel.a{color:var(--cheong)} .tray .glabel.b{color:var(--jeok)}
.tray .stack{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:560px){.tray{flex-direction:column;flex-wrap:nowrap;align-items:stretch}.tray .group{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.tray .glabel{grid-column:1/-1}.tray .group.turn{grid-template-columns:1fr 1.4fr}.tray .btn{justify-content:center}}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.rail section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rail h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.legend{display:flex;flex-direction:column;gap:8px}
.lg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px}
.lg b{display:block;font-size:13px}
.lg svg{width:40px;height:50px;background:var(--panel-2);border-radius:8px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:220px;overflow:auto}
#log li{color:var(--muted)}
#log li:first-child{color:var(--fg)}
.keys{font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.keys kbd{font-family:var(--font-mono);font-size:11px;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:0 5px;justify-self:start}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:660px;width:100%;display:flex;flex-direction:column;gap:14px;margin:auto;box-shadow:0 18px 40px #1c29221f}
.card.wide{max-width:900px}
.card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(36px,7vw,56px);line-height:1.05;margin:0;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--jeok)}
.card h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.card p{margin:0;max-width:64ch}
.story{font-family:var(--font-story);font-size:15.5px;line-height:1.75;color:var(--fg);border-left:3px solid var(--hwang);padding-left:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.menu-list{display:grid;gap:8px}
.menu-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px 14px;cursor:pointer}
.menu-item:hover:not(:disabled){border-color:var(--hwang-d)}
.menu-item:focus-visible{outline:2px solid var(--cheong);outline-offset:2px}
.menu-item b{font-size:15px}
.menu-item span{color:var(--muted);font-size:12.5px;grid-column:1}
.menu-item em{grid-row:1/span 2;grid-column:2;font-style:normal;font-family:var(--font-mono);font-size:12px;color:var(--ok)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.tab.on.A{background:var(--cheong);border-color:var(--cheong);color:#fff}
.tab.on.B{background:var(--jeok);border-color:var(--jeok);color:#fff}
.tab.on.C{background:var(--hwang);border-color:var(--hwang-d);color:#2b1d00}
.tab:focus-visible{outline:2px solid var(--cheong);outline-offset:2px}
.treeintro{font-size:13px;color:var(--muted)}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.trait{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 12px}
.keyart{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.portrait{position:relative;width:56px;height:56px;border-radius:50%;grid-row:1/span 2;box-shadow:inset 0 0 0 2px #fff}
.trait.A .portrait{background:var(--cheong-l)} .trait.B .portrait{background:var(--jeok-l)} .trait.C .portrait{background:#fdf1cf}
.portrait svg{width:100%;height:100%;border-radius:50%}
.portrait i{position:absolute;right:-5px;bottom:-3px;width:22px;height:22px;border-radius:6px;font:700 13px var(--font-story);font-style:normal;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 2px #fff}
.trait.A .portrait i{background:var(--cheong)} .trait.B .portrait i{background:var(--jeok)} .trait.C .portrait i{background:var(--hwang);color:#2b1d00}
.introfig{display:flex;gap:4px;align-items:flex-end}.introfig svg{width:64px;height:80px}
.trait .glyph{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-story);font-weight:700;font-size:22px;color:#fff;grid-row:1/span 2}
.trait.A .glyph{background:var(--cheong)} .trait.B .glyph{background:var(--jeok)} .trait.C .glyph{background:var(--hwang);color:#2b1d00}
.trait .who{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.trait b{font-size:14.5px}
.trait p{font-size:12.5px;color:var(--muted);grid-column:2}
.trait .lv{display:flex;gap:3px;flex-shrink:0}
.trait .lv i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.trait.A .lv i.on{background:var(--cheong)} .trait.B .lv i.on{background:var(--jeok)}
.trait .btn{grid-column:2;justify-self:start}
.trait.locked{opacity:.6}
.points{font-family:var(--font-mono);font-size:15px}
.points b{color:var(--jeok);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--font-mono);font-size:20px}
.stats span{font-size:11.5px;color:var(--muted)}
/* ---------- svg ---------- */
.g1{fill:var(--grass)} .g2{fill:var(--grass-2)}
.flw{fill:var(--flower)} .flc{fill:var(--hwang)}
.shd{fill:#1d3b1a;opacity:.18}
.trunk{fill:var(--trunk)}
.cd{fill:var(--can-d)} .cm{fill:var(--can-m)} .cl{fill:var(--can-l)}
.pd{fill:#e07fa3} .pm{fill:var(--blossom)} .pl{fill:var(--blossom-2)}
.bush{fill:var(--bush)} .bush2{fill:var(--bush-2)} .berry{fill:var(--berry)}
.rk{fill:var(--rock-2)} .rk2{fill:var(--rock)} .rk3{fill:var(--rock-3)}
.road{fill:var(--road)} .roadp{fill:var(--road-2)} .roade{stroke:var(--road-2);stroke-width:2;stroke-linecap:round}
.trailp{fill:var(--trailp)} .prt{fill:var(--print)} .twig{stroke:var(--bush);stroke-width:2;fill:none;stroke-linecap:round}
.stone{fill:var(--stone);stroke:var(--stone-2);stroke-width:1.5} .stonel{stroke:var(--stone-2);stroke-width:1.2;fill:none} .stonetop{fill:#efe9dd}
.wood{fill:var(--wood);stroke:var(--wood-2);stroke-width:1.5} .woodend{fill:#e2b380;stroke:var(--wood-2);stroke-width:1}
.hpdot{fill:var(--jeok);stroke:#fff;stroke-width:1}
.hpdot.off{fill:#ffffff;stroke:var(--jeok)}
.goal{fill:var(--hwang);opacity:.22}
.goalline{stroke:var(--hwang-d);stroke-width:3;stroke-dasharray:6 6}
.mv{fill:color-mix(in srgb,var(--hwang) 22%,transparent);stroke:var(--hwang-d);stroke-width:2}
.mvt{fill:var(--hwang-d);font:700 13px var(--font-mono);text-anchor:middle}
.pl-ok{fill:color-mix(in srgb,var(--cheong) 18%,transparent);stroke:var(--cheong);stroke-width:2;stroke-dasharray:4 3}
.pl-ok.b{fill:color-mix(in srgb,var(--jeok) 14%,transparent);stroke:var(--jeok)}
.hov{fill:none;stroke:#fff;stroke-width:2.5;opacity:.9}
.hov.bad{stroke:var(--bad)}
.rng{fill:var(--cheong);opacity:.12}
.pv{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 6}
.pvbrk{fill:none;stroke-width:2.5;stroke:var(--warn)}
.danger{fill:var(--bad);opacity:.16}
.warnring{fill:none;stroke:var(--jeok);stroke-width:3;stroke-dasharray:5 4}
.warntxt{fill:var(--jeok);font:800 20px var(--font-body);text-anchor:middle}
.offchip{fill:var(--heuk)} .offtxt{fill:#fff;font:600 12px var(--font-body)}
.skin{fill:#ffdcb8} .eyec{fill:#2a1d14} .mouth{stroke:#7a3a2a;stroke-width:1.2;stroke-linecap:round}
.robe{fill:#fffaf0;stroke:#cdb98d;stroke-width:1.2} .robe-line{stroke:#cdb98d;stroke-width:1.2}
.sash{fill:var(--hwang)} .jade{fill:#48c9a0;stroke:#fff;stroke-width:1}
.straw{fill:#e2bf6a;stroke:#b48f3a;stroke-width:1} .straw2{fill:#d5ae55}
.uni{fill:#30354b} .uni-s{fill:#4a3f7a} .red{fill:var(--jeok)} .hat{fill:#1f2230}
.haft{stroke:#7a4d28;stroke-width:2.2;stroke-linecap:round;fill:none} .tip{fill:#b8c2cc} .axe{fill:#aeb8c2;stroke:#5d6670;stroke-width:1}
.bow{stroke:#7a4d28;stroke-width:2.4;fill:none;stroke-linecap:round} .string{stroke:#3a2a1a;stroke-width:.8}
.badge{fill:#fff} .badget{fill:#1f2230;font:700 6.5px var(--font-story);text-anchor:middle}
.aly{fill:var(--cheong)} .aly-hb{fill:#fff}
.twr-leg{stroke:#7a4d28;stroke-width:3;stroke-linecap:round} .twr-plat{fill:var(--wood);stroke:var(--wood-2);stroke-width:1.2} .twr-roof{fill:var(--cheong)} .twr-flag{fill:var(--jeok)}
.trap1{fill:#8e99a6;stroke:#5d6670;stroke-width:1}
.ent{transition:transform .14s cubic-bezier(.3,.7,.4,1)}
.ent .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.ent .zz{display:none;fill:var(--warn);font:800 13px var(--font-mono)}
.ent.stun .zz{display:block}
.ent.stun .bob{opacity:.6;animation:none}
.ent.dead{opacity:0;transition:opacity .35s}
.fx{transform-box:fill-box;transform-origin:center;animation:fx .55s ease-out forwards;fill:none;stroke-width:3}
.fx.hit{stroke:var(--bad)} .fx.kill{stroke:var(--cheong)} .fx.spawn{stroke:var(--jeok)} .fx.stunfx{stroke:var(--warn)}
@keyframes fx{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.chip{animation:chip .5s ease-out forwards}
@keyframes chip{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.dust{fill:#fff;opacity:.7;transform-box:fill-box;transform-origin:center;animation:dust .5s ease-out forwards}
@keyframes dust{to{transform:scale(2);opacity:0}}
.ftxt{font:800 15px var(--font-body);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3.5px;animation:rise .8s ease-out forwards}
.ftxt.bad{fill:var(--bad)} .ftxt.ally{fill:var(--cheong)} .ftxt.gold{fill:var(--hwang-d)}
@keyframes rise{to{transform:translateY(-20px);opacity:0}}
.shot{stroke:var(--cheong);stroke-width:2.5;stroke-linecap:round;animation:shot .35s ease-out forwards}
.shot.enemy{stroke:var(--bad)}
@keyframes shot{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.ent,.bar .fill,.bar .ghost{transition:none}.ent .bob{animation:none}.fx,.shot,.chip,.dust,.ftxt{animation-duration:.01s}.boardwrap.shake{animation:none}.petals{display:none}#world{transition:none!important}.banner.show{animation-duration:.01s}}
</style>
</head>
<body>

<script>
(()=>{
'use strict';
/* ================= RULES (tunable) ================= */
const RULES={
  playerMove:3,          // 왕손의 기본 이동 칸
  enemyAP:3,             // 적 기본 행동력 (이동 1칸 / 흔적 파괴 1 / 성벽 공격 1)
  straightLen:4,         // 길(road)이 직선으로 4칸 이어지면 4칸 이동
  trailHp:{forest:1,thicket:2}, thicketMoveCost:2,
  winGap:20, defGap:10, defWaves:3, waveRetreat:6,
  baseHp:3, baseSpear:1,
  scoutMax:3,            // 스테이지당 정탐병 총 투입 수
  scoutConcurrent:2,     // 동시에 활동하는 정탐병 수
  scoutHp:3, scoutRespawn:3,
  buildGap:10,           // 이 간격 이상일 때 성벽·방어시설 건설 가능
  supplyStart:6, supplyPerTurn:1,
  wallHp:4, barricadeHp:3, towerRange:2,
  cost:{wall:2,tower:3,caltrop:1},
};
const CELL=48, DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const K=(c,r)=>c+','+r;
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP=RM?30:125;
const NS='http://www.w3.org/2000/svg';

function hash2(c,r,seed){let h=(seed|0)^Math.imul(c|0,374761393)^Math.imul(r|0,668265263);h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,seed){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,s=t=>t*t*(3-2*t);
  const a=hash2(xi,yi,seed),b=hash2(xi+1,yi,seed),c=hash2(xi,yi+1,seed),d=hash2(xi+1,yi+1,seed),u=s(xf),v=s(yf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

/* ================= DATA ================= */
const EDEF={
  scout:{name:'정탐병',ap:3,range:0,hp:RULES.scoutHp,brk:true,desc:'흔적을 베어 길을 냅니다. 행동력 3을 이동·흔적 파괴·성벽 공격에 씁니다. 겹친 칸에서만 공격, 체력 3. 스테이지당 3명, 동시에 2명까지.'},
  inf:{name:'포졸',ap:3,range:0,hp:1,desc:'웨이브 병사. 정탐병이 낸 길로만 행군하고 흔적은 못 부숩니다. 성벽은 부숩니다. 겹친 칸에서만 공격.'},
  spear:{name:'창병',ap:3,range:1,hp:1,desc:'웨이브 병사. 길로만 행군. 십자 1칸 거리에서 공격.'},
  archer:{name:'궁수',ap:2,range:2,hp:1,desc:'웨이브 병사. 길로만 행군, 이동 2. 십자 2칸 거리에서 공격.'},
};
const TREES={
  A:{name:'도주의 충신들',short:'A · 도주',intro:'왕손이 달아나도록 돕는 충신들입니다. 도주 중 언제든 힘을 보탭니다.'},
  B:{name:'옹립 세력',short:'B · 디펜스',intro:'왕손을 다시 왕좌에 올리려는 세력과 충신들입니다. 간격이 10칸 이상 벌어지면 합류해 성벽과 망루를 세웁니다.'},
  C:{name:'특수',short:'C · 특수',intro:'특수 계열은 준비 중입니다.'},
};
const TRAITS=[
  {tree:'A',id:'sprint',who:'마부 돌쇠',g:'馬',max:2,cost:1,desc:l=>`말을 내어줍니다. 한 턴 이동 +1칸 (현재 ${RULES.playerMove+l}칸)`},
  {tree:'A',id:'trap',who:'사냥꾼 범이',g:'獵',max:3,cost:1,desc:l=>`덫 +2. 밟은 병사는 쓰러지고, 정탐병은 피해 1에 2턴 묶입니다 (현재 ${2+2*l}개)`},
  {tree:'A',id:'spear',who:'호위무사 강철',g:'護',max:3,cost:1,desc:l=>`아군 창병 +1. 무적, 길이 아닌 칸에만 배치, 십자 1칸 공격 (현재 ${RULES.baseSpear+l}명)`},
  {tree:'A',id:'archer',who:'명궁 소연',g:'弓',max:2,cost:2,desc:l=>`아군 궁수 +1. 무적, 길이 아닌 칸에만 배치, 십자 2칸 공격 (현재 ${l}명)`},
  {tree:'A',id:'barricade',who:'나무꾼 억쇠',g:'木',max:2,cost:1,desc:l=>`통나무 +1. 길·흔적 위에 쌓으면 적이 ${RULES.barricadeHp}번 내리쳐야 지나갑니다 (현재 ${l}개)`},
  {tree:'A',id:'tough',who:'의녀 단비',g:'醫',max:2,cost:1,desc:l=>`상처를 돌봅니다. 최대 체력 +1 (현재 ${RULES.baseHp+l})`},
  {tree:'A',id:'zigzag',who:'길잡이 바우',g:'道',max:1,cost:2,desc:()=>`굽은 샛길로 안내합니다. 적이 직진 ${RULES.straightLen}칸 보너스를 얻지 못합니다`},
  {tree:'A',id:'machete',who:'약초꾼 달래',g:'草',max:1,cost:1,desc:()=>`숲길을 압니다. 덤불 이동 비용 ${RULES.thicketMoveCost} → 1`},
  {tree:'A',id:'smoke',who:'화약장 염노',g:'火',max:2,cost:1,desc:l=>`연막 +1. 추격대의 한 턴을 통째로 멈춥니다 (현재 ${l}개)`},
  {tree:'B',id:'funds',who:'외척 대감 윤씨',g:'財',max:3,cost:1,desc:l=>`군자금을 댑니다. 옹립 세력 합류 시 자재 +3 (현재 ${RULES.supplyStart+3*l})`},
  {tree:'B',id:'masonry',who:'석공 막돌',g:'城',max:2,cost:1,desc:l=>`성벽 체력 +2 (현재 ${RULES.wallHp+2*l})`},
  {tree:'B',id:'volley',who:'의병장 곽씨',g:'樓',max:1,cost:2,desc:l=>`망루가 적 턴마다 한 번 더 쏩니다 (현재 ${1+l}번)`},
  {tree:'B',id:'supply',who:'상단 행수 홍씨',g:'商',max:2,cost:1,desc:l=>`간격 ${RULES.buildGap}칸 이상인 턴마다 자재 +1 추가 (현재 턴당 ${RULES.supplyPerTurn+l})`},
  {tree:'B',id:'beacon',who:'봉수군 칠복',g:'烽',max:2,cost:1,desc:l=>`봉화로 미리 알립니다. 웨이브가 2턴씩 늦게 옵니다 (현재 +${2*l}턴)`},
  {tree:'B',id:'monk',who:'승병장 무진',g:'僧',max:1,cost:2,desc:()=>`아군 병사·망루가 정탐병에게 주는 피해 +1`},
  {tree:'B',id:'guard',who:'옛 금군 별장',g:'衛',max:1,cost:1,desc:()=>`옹립 세력 합류 시 최대 체력 +1, 체력 1 회복`},
];
const ITEMS=[
  {id:'trap',name:'덫',key:'1',hint:'흔적이나 길 위에 설치하세요'},
  {id:'spear',name:'창병',key:'2',hint:'길이 아닌 빈 칸(숲·덤불)에 배치하세요'},
  {id:'archer',name:'궁수',key:'3',hint:'길이 아닌 빈 칸(숲·덤불)에 배치하세요'},
  {id:'barricade',name:'통나무',key:'4',hint:'흔적이나 길 위에 쌓으세요'},
  {id:'smoke',name:'연막',key:'5',hint:'이번 추격대 턴을 건너뜁니다'},
];
const BUILDS=[
  {id:'wall',name:'성벽',key:'6',hint:'흔적이나 길 위에 건설. 적이 부숴야 지나가고 적의 사선을 막습니다'},
  {id:'tower',name:'망루',key:'7',hint:'길이 아닌 칸에 건설. 무적, 십자 2칸 사격'},
  {id:'caltrop',name:'마름쇠',key:'8',hint:'흔적이나 길 위에 설치. 덫과 같습니다'},
];

/* ================= META / RUN ================= */
const META_KEY='forest-run-meta-v2';
let meta={t1:false,t2:false,best:0};
try{const m=JSON.parse(localStorage.getItem(META_KEY)||localStorage.getItem('forest-run-meta-v1')||'null');if(m)meta=Object.assign(meta,m)}catch(e){}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta))}catch(e){}}
let run=null,traitTab='A';
function newRun(){run={stage:3,points:(meta.t1?1:0)+(meta.t2?1:0),traits:{},turns:0,cleared:0,kills:0}}
const lv=id=>(S&&S.useTraits&&run)?(run.traits[id]||0):0;
const rlv=id=>run?(run.traits[id]||0):0;

/* ================= STAGE ================= */
let S=null, VC=12, camX=0, busy=false, place=null, smokeArmed=false, preview=null, liveGap=null;

function baseStage(){return {terr:{},trail:{},walls:{},enemies:[],traps:{},units:{},turn:1,log:[],nextId:1,over:false,genCol:-1,
  items:{trap:0,spear:0,archer:0,barricade:0,smoke:0},useTraits:false,waves:[],waveSpawned:0,blocked:0,nextWaveTurn:Infinity,spawnQ:[],waveInfo:{},kills:0,
  supply:0,buildOpen:false,scoutsUsed:0,scoutPlan:[]}}

function stageCfg(n){
  const T=a=>a.map(s=>s.split(' '));
  let waves;
  if(n===3) waves=T(['inf inf','inf inf inf','inf inf inf']);
  else if(n===4) waves=T(['inf spear','inf spear inf','spear inf spear inf']);
  else if(n===5) waves=T(['inf archer spear','spear archer inf inf','archer spear inf archer']);
  else {const x=Math.min(4,n-5);waves=T(['spear archer inf'+' inf'.repeat(x>1?1:0),'archer spear inf spear'+' inf'.repeat(x>2?1:0),'archer archer spear spear inf'+' inf'.repeat(x>3?1:0)]);}
  const sub=n===3?'첫 추격대':n===4?'창병 합류':n===5?'궁수 합류':'깊은 숲';
  return {waves,sub,firstWave:n===3?4:3,waveGap:n>=6?3:4,scout2:n===3?7:n===4?6:5,rockT:Math.max(.64,.74-.02*(n-3)),thkT:Math.max(.5,.6-.02*(n-3))};
}
function genColumn(S,c){
  const cf=S.cfg,rows=S.rows,col=[];
  for(let r=0;r<rows;r++){
    let t='forest';
    if(c>=6){const rn=vnoise(c*.38,r*.62,S.seed+7),tn=vnoise(c*.21,r*.45,S.seed+13);
      if(rn>cf.rockT||hash2(c,r,S.seed+3)<.035)t='rock';else if(tn>cf.thkT)t='thicket';}
    col.push(t);
  }
  let rocks=col.map((t,r)=>t==='rock'?r:-1).filter(r=>r>=0);
  while(rocks.length>rows-3){const i=Math.floor(hash2(c,rocks.length,S.seed+5)*rocks.length);col[rocks[i]]='thicket';rocks.splice(i,1)}
  col.forEach((t,r)=>{S.terr[K(c,r)]=t});S.genCol=c;
}
function ensureCols(S,upto){if(S.cols!==Infinity)return;while(S.genCol<upto)genColumn(S,S.genCol+1)}
function addEnemy(S,type,c,r,wave){const e={id:S.nextId++,type,c,r,hp:EDEF[type].hp,stun:0,lastDir:0,alive:true,wave:wave||0};S.enemies.push(e);if(type==='scout')S.scoutsUsed++;return e}

function makeStage(id){
  const S=baseStage();S.id=id;
  if(id==='t1'){
    Object.assign(S,{name:'튜토리얼 1',sub:'첫 걸음',rows:1,cols:7});
    for(let c=0;c<7;c++)S.terr[K(c,0)]='forest';
    S.terr[K(0,0)]='road';S.genCol=6;
    S.player={c:0,r:0,hp:1,maxHp:1,dir:0};S.goal={type:'reach',col:6,maxTurns:2};
  }else if(id==='t2'){
    Object.assign(S,{name:'튜토리얼 2',sub:'뒤쫓는 정탐병',rows:5,cols:10});
    const L=['......#...','...#..#...','RT.#..#...','...#.t....','....tt..#.'];
    L.forEach((row,r)=>[...row].forEach((ch,c)=>{S.terr[K(c,r)]=ch==='#'?'rock':ch==='t'?'thicket':ch==='R'?'road':'forest';if(ch==='T')S.trail[K(c,r)]=1}));
    S.genCol=9;S.player={c:1,r:2,hp:1,maxHp:1,dir:0};addEnemy(S,'scout',0,2);S.goal={type:'reach',col:9};
  }else{
    const n=id,cfg=stageCfg(n);
    Object.assign(S,{name:`${n}스테이지`,sub:cfg.sub,rows:7,cols:Infinity,seed:(Math.random()*2147483647)|0,cfg,useTraits:true});
    ensureCols(S,40);
    for(let c=0;c<=2;c++)S.terr[K(c,3)]='road';
    S.trail[K(3,3)]=1;
    const hp=RULES.baseHp+lv('tough');
    S.player={c:3,r:3,hp,maxHp:hp,dir:0};
    addEnemy(S,'scout',0,3);
    S.scoutPlan=[{turn:cfg.scout2}];
    S.goal={type:'gap',gap:RULES.winGap,def:RULES.defGap,waves:RULES.defWaves};
    S.waves=cfg.waves;S.nextWaveTurn=cfg.firstWave+2*lv('beacon');
    S.items={trap:2+2*lv('trap'),spear:RULES.baseSpear+lv('spear'),archer:lv('archer'),barricade:lv('barricade'),smoke:lv('smoke')};
  }
  S.ap=moveMax(S);takeSnap(S);return S;
}
const moveMax=S=>RULES.playerMove+(S.useTraits&&run?(run.traits.sprint||0):0);
const thkCost=()=>lv('machete')?1:RULES.thicketMoveCost;
const wallMax=()=>RULES.wallHp+2*lv('masonry');

function inB(c,r){return S&&r>=0&&r<S.rows&&c>=0&&c<S.cols&&c<=S.genCol}
function terr(c,r){if(!S||r<0||r>=S.rows||c<0||c>=S.cols)return null;if(c>S.genCol)ensureCols(S,c+5);return S.terr[K(c,r)]}
const wallHp=(k,st)=>st?(st.walls[k]||0):(S.walls[k]?S.walls[k].hp:0);
const trailHp=(k,st)=>(st?st.trail:S.trail)[k]||0;
const isGraph=(c,r,st)=>{const k=K(c,r);return S.terr[k]==='road'||trailHp(k,st)>0||wallHp(k,st)>0};
const onPath=(c,r)=>isGraph(c,r);
const enemyAt=(c,r)=>S.enemies.find(e=>e.alive&&e.c===c&&e.r===r);
const aliveScouts=()=>S.enemies.filter(e=>e.alive&&e.type==='scout');
function simState(){const w={};for(const k in S.walls)w[k]=S.walls[k].hp;return {trail:Object.assign({},S.trail),walls:w}}

function takeSnap(S){S.snap=JSON.stringify({player:S.player,terr:S.terr,trail:S.trail,walls:S.walls,traps:S.traps,units:S.units,items:S.items,ap:S.ap,genCol:S.genCol,supply:S.supply,buildOpen:S.buildOpen})}
function undo(){if(busy||!S||S.over||!modal.hidden)return;Object.assign(S,JSON.parse(S.snap));place=null;smokeArmed=false;render();toast('이번 턴을 처음 상태로 되돌렸어요')}

/* ================= PATHING ================= */
// Dijkstra from the player over trail ∪ road ∪ walls. dist[n] = cost for an enemy at n to reach the player.
// Entering a cell costs wall hp + trail hp + 1. Entering the player's cell (attack) costs 1.
function costField(st){
  const P=S.player,dist=new Map(),heap=[[0,P.c,P.r]];dist.set(K(P.c,P.r),0);
  const push=it=>{heap.push(it);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return top};
  while(heap.length){
    const [d,c,r]=pop(),k=K(c,r);if(d>dist.get(k))continue;
    const enter=(c===P.c&&r===P.r)?1:wallHp(k,st)+trailHp(k,st)+1;
    for(const [dx,dy] of DIRS){const nc=c+dx,nr=r+dy;if(!inB(nc,nr)||!isGraph(nc,nr,st))continue;const nk=K(nc,nr),nd=d+enter;
      if(!dist.has(nk)||nd<dist.get(nk)){dist.set(nk,nd);push([nd,nc,nr])}}
  }
  return dist;
}
function cellField(){
  const P=S.player,dist=new Map([[K(P.c,P.r),0]]),q=[[P.c,P.r]];
  for(let i=0;i<q.length;i++){const [c,r]=q[i],d=dist.get(K(c,r));for(const [dx,dy] of DIRS){const nc=c+dx,nr=r+dy,nk=K(nc,nr);if(!inB(nc,nr)||dist.has(nk)||!isGraph(nc,nr))continue;dist.set(nk,d+1);q.push([nc,nr])}}
  return dist;
}
function routeOf(e,field,st){
  const out=[];let c=e.c,r=e.r,pref=e.lastDir,guard=0,d=field.get(K(c,r));
  if(d===undefined)return out;
  while(d>0&&guard++<500){
    let pick=-1;
    for(const di of [pref,0,1,2,3]){const nc=c+DIRS[di][0],nr=r+DIRS[di][1],nk=K(nc,nr),nd=field.get(nk);if(nd===undefined)continue;
      const enter=(nc===S.player.c&&nr===S.player.r)?1:wallHp(nk,st)+trailHp(nk,st)+1;if(nd+enter===d){pick=di;break}}
    if(pick<0)break;c+=DIRS[pick][0];r+=DIRS[pick][1];out.push({c,r,dir:pick});pref=pick;d=field.get(K(c,r));
  }
  return out;
}
// cross-shaped line of sight; rocks block everything, walls block the enemy's shots
function losRange(a,b,range,wallsBlock){
  if(range<=0)return false;if(a.c!==b.c&&a.r!==b.r)return false;
  const dist=Math.abs(a.c-b.c)+Math.abs(a.r-b.r);if(dist===0||dist>range)return false;
  const dx=Math.sign(b.c-a.c),dy=Math.sign(b.r-a.r);
  for(let i=1;i<dist;i++){const c=a.c+dx*i,r=a.r+dy*i;if(terr(c,r)==='rock')return false;if(wallsBlock&&S.walls[K(c,r)])return false}
  return true;
}
function planEnemy(e,st,maze,occ){
  const def=EDEF[e.type],P=S.player,field=costField(st),route=routeOf(e,field,st);
  let ap=def.ap,straight=false;
  if(!maze&&route.length>=RULES.straightLen){
    const seg=route.slice(0,RULES.straightLen);
    if(seg.every(s=>s.dir===seg[0].dir)&&seg.every(s=>(s.c===P.c&&s.r===P.r)||(trailHp(K(s.c,s.r),st)===0&&wallHp(K(s.c,s.r),st)===0))){ap=Math.max(ap,RULES.straightLen);straight=true}
  }
  const acts=[];let pos={c:e.c,r:e.r},i=0;
  while(ap>0){
    if(losRange(pos,P,def.range,true)){acts.push({t:'atk',c:pos.c,r:pos.r});break}
    const nx=route[i];if(!nx)break;
    if(nx.c===P.c&&nx.r===P.r){acts.push({t:'atk',c:pos.c,r:pos.r,melee:true});break}
    const k=K(nx.c,nx.r);
    if(occ&&occ.has(k))break;                                  // single file
    if(st.walls[k]>0){st.walls[k]--;ap--;acts.push({t:'wall',c:nx.c,r:nx.r});continue}   // anyone can hit walls
    if(st.trail[k]>0){if(!def.brk)break;st.trail[k]--;ap--;acts.push({t:'brk',c:nx.c,r:nx.r});continue} // only scouts cut trail
    ap--;pos={c:nx.c,r:nx.r};i++;acts.push({t:'mv',c:nx.c,r:nx.r,dir:nx.dir});
  }
  return {acts,straight};
}

/* ================= PLAYER ACTIONS ================= */
function tryStep(di){
  if(busy||!S||S.over||!modal.hidden)return;
  if(place)place=null;
  const P=S.player,nc=P.c+DIRS[di][0],nr=P.r+DIRS[di][1],t=terr(nc,nr),k=K(nc,nr);
  if(di===0||di===2)P.dir=di;
  if(t===null){toast('지도 밖으로는 갈 수 없어요');return}
  if(t==='rock'){toast('바위는 지날 수 없어요');return}
  if(S.walls[k]){toast('성벽과 통나무는 지날 수 없어요');return}
  if(enemyAt(nc,nr)){toast('추격대가 있는 칸으로는 갈 수 없어요');return}
  if(S.units[k]){toast('아군이 서 있는 칸이에요');return}
  const path=t==='road'||S.trail[k]>0,cost=(!path&&t==='thicket')?thkCost():1;
  if(cost>S.ap){toast(S.ap>0?`덤불은 ${cost}칸 몫이 필요해요`:'이번 턴 이동을 다 썼어요. 턴을 종료하세요');return}
  const from={c:P.c,r:P.r};
  S.ap-=cost;P.c=nc;P.r=nr;
  if(!path)S.trail[k]=RULES.trailHp[t==='thicket'?'thicket':'forest'];
  ensureCols(S,P.c+30);
  dust(from.c,from.r);
  render();checkOpen();
  if(S.goal.type==='reach'&&P.c>=S.goal.col)win('reach');
}
function inView(c){return c>=Math.floor(camX)&&c<=Math.floor(camX)+VC}
function canPlace(id,c,r){
  const t=terr(c,r);if(!t||t==='rock'||!inView(c))return false;
  const k=K(c,r),P=S.player;
  if(c===P.c&&r===P.r)return false;if(enemyAt(c,r))return false;
  const path=t==='road'||S.trail[k]>0;
  if(id==='trap'||id==='caltrop')return path&&!S.walls[k]&&!S.traps[k];
  if(id==='barricade'||id==='wall')return path&&!S.walls[k]&&!S.traps[k];
  if(id==='spear'||id==='archer'||id==='tower')return !path&&!S.walls[k]&&!S.units[k]&&!S.traps[k];
  return false;
}
const isBuild=id=>BUILDS.some(b=>b.id===id);
const canBuildNow=()=>S&&S.useTraits&&S.buildOpen&&(liveGap===null||liveGap>=RULES.buildGap);
function doPlace(c,r){
  if(!place||place==='smoke')return;
  const id=place,k=K(c,r),build=isBuild(id);
  const meta_=build?BUILDS.find(b=>b.id===id):ITEMS.find(i=>i.id===id);
  if(!canPlace(id,c,r)){toast(meta_.hint);return}
  if(build){
    if(!canBuildNow()){toast(`간격 ${RULES.buildGap}칸 이상일 때만 지을 수 있어요`);place=null;render();return}
    if(S.supply<RULES.cost[id]){toast('자재가 부족해요');return}
    S.supply-=RULES.cost[id];
  }else S.items[id]--;
  if(id==='trap'||id==='caltrop')S.traps[k]=1;
  else if(id==='barricade')S.walls[k]={hp:RULES.barricadeHp,max:RULES.barricadeHp,kind:'wood'};
  else if(id==='wall')S.walls[k]={hp:wallMax(),max:wallMax(),kind:'stone'};
  else if(id==='tower')S.units[k]={type:'tower',range:RULES.towerRange,shots:1+lv('volley')};
  else S.units[k]={type:id,range:id==='spear'?1:2,shots:1};
  floatText(c,r,build?`-${RULES.cost[id]}`:'배치',build?'gold':'ally');
  if(build?S.supply<RULES.cost[id]:S.items[id]<=0)place=null;
  render();
}
function selectItem(id){
  if(busy||!S||S.over||!S.useTraits||!modal.hidden)return;
  if(id==='smoke'){if(S.items.smoke<=0&&!smokeArmed)return;smokeArmed=!smokeArmed;place=null;toast(smokeArmed?'연막 준비: 이번 턴을 끝내면 추격대가 움직이지 못합니다':'연막 취소');render();return}
  if(isBuild(id)){
    if(!S.buildOpen){toast(`정탐병과 간격을 ${RULES.buildGap}칸 벌리면 옹립 세력이 합류합니다`);return}
    if(!canBuildNow()){toast(`지금 간격이 ${RULES.buildGap}칸보다 좁아 지을 수 없어요`);return}
    if(S.supply<RULES.cost[id]){toast('자재가 부족해요');return}
  }else if(S.items[id]<=0){toast('남은 수량이 없어요');return}
  place=place===id?null:id;
  if(place)toast((isBuild(id)?BUILDS:ITEMS).find(i=>i.id===id).hint);
  render();
}
// restoration faction joins the first time the gap reaches buildGap
function checkOpen(){
  if(!S||!S.useTraits||S.buildOpen||S.over)return;
  const g=gapInfo().gap;
  if(g!==null&&g<RULES.buildGap)return;
  S.buildOpen=true;S.supply+=RULES.supplyStart+3*lv('funds');
  if(lv('guard')){S.player.maxHp++;S.player.hp=Math.min(S.player.maxHp,S.player.hp+1)}
  log(`옹립 세력 합류! 자재 ${S.supply}. 성벽·망루를 지을 수 있습니다`);
  banner('옹립 세력 합류','red');render();
}

/* ================= EFFECTS ================= */
function log(msg){S.log.unshift(msg);if(S.log.length>40)S.log.pop();renderLog()}
function svgEl(tag,attrs,cls){const el=document.createElementNS(NS,tag);for(const a in attrs)el.setAttribute(a,attrs[a]);if(cls)el.setAttribute('class',cls);$('#fxl').appendChild(el);return el}
function fx(c,r,kind){const el=svgEl('circle',{cx:c*CELL+24,cy:r*CELL+24,r:18},'fx '+kind);setTimeout(()=>el.remove(),650)}
function floatText(c,r,txt,kind){const el=svgEl('text',{x:c*CELL+24,y:r*CELL+8},'ftxt '+(kind||'bad'));el.textContent=txt;setTimeout(()=>el.remove(),850)}
function dust(c,r){if(RM)return;for(let i=0;i<3;i++){const el=svgEl('circle',{cx:c*CELL+14+i*10,cy:r*CELL+40,r:3},'dust');setTimeout(()=>el.remove(),550)}}
function chips(c,r,color){if(RM)return;for(let i=0;i<5;i++){const el=svgEl('rect',{x:c*CELL+22,y:r*CELL+22,width:5,height:4,fill:color,rx:1},'chip');el.style.setProperty('--dx',(Math.random()*36-18)+'px');el.style.setProperty('--dy',(-6-Math.random()*20)+'px');setTimeout(()=>el.remove(),550)}}
function shot(a,b,enemy){const el=svgEl('line',{x1:a.c*CELL+24,y1:a.r*CELL+20,x2:b.c*CELL+24,y2:b.r*CELL+22},'shot'+(enemy?' enemy':''));setTimeout(()=>el.remove(),400)}
let bannerT=0;
function banner(text,kind){const b=$('#banner');b.className='banner '+(kind||'');b.querySelector('span').textContent=text;void b.offsetWidth;b.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),1600)}
function shake(){const bw=$('#bw');bw.classList.remove('shake','flash');void bw.offsetWidth;bw.classList.add('shake','flash')}

/* ================= ENEMY TURN ================= */
function kill(e,why){
  e.alive=false;S.kills++;if(run&&S.useTraits)run.kills++;fx(e.c,e.r,'kill');floatText(e.c,e.r,'격퇴','ally');
  log(`${EDEF[e.type].name} 격퇴 (${why})`);
  if(e.type==='scout'&&S.useTraits){
    if(S.scoutsUsed<RULES.scoutMax){S.scoutPlan.push({turn:S.turn+RULES.scoutRespawn});log(`추격대가 ${RULES.scoutRespawn}턴 뒤 정탐병을 다시 보냅니다 (남은 투입 ${RULES.scoutMax-S.scoutsUsed})`)}
    else log('더 이상 보낼 정탐병이 없습니다');
  }
}
function hitPlayer(e){
  const P=S.player;P.hp--;fx(P.c,P.r,'hit');floatText(P.c,P.r,'-1','bad');shake();
  if(EDEF[e.type].range>0)shot(e,P,true);
  log(`${EDEF[e.type].name}에게 공격당했습니다! 체력 ${Math.max(0,P.hp)}`);
  if(e.type==='scout')e.stun=1;
  if(P.hp<=0)lose(`${EDEF[e.type].name}에게 붙잡혔습니다`);
}
function towersReact(e){
  for(const [k,u] of Object.entries(S.units)){
    if(!e.alive)break;const [c,r]=k.split(',').map(Number);
    while(u.left>0&&e.alive&&losRange({c,r},e,u.range,false)){
      u.left--;const dmg=1+(e.type==='scout'&&lv('monk')?1:0);
      e.hp-=dmg;shot({c,r},e,false);floatText(e.c,e.r,`-${dmg}`,'ally');
      if(e.hp<=0)kill(e,u.type==='tower'?'망루':u.type==='spear'?'아군 창병':'아군 궁수');
    }
  }
  return !e.alive;
}
async function enemyPhase(){
  for(const u of Object.values(S.units))u.left=u.shots;
  for(const e of S.enemies){if(e.alive)towersReact(e)}
  const cf=costField(simState());
  const order=S.enemies.filter(e=>e.alive).sort((a,b)=>(cf.get(K(a.c,a.r))??999)-(cf.get(K(b.c,b.r))??999));
  const maze=lv('zigzag')>0;
  for(const e of order){
    if(!e.alive)continue;
    if(e.stun>0){e.stun--;render();continue}
    const occ=new Set(S.enemies.filter(o=>o.alive&&o!==e).map(o=>K(o.c,o.r)));
    const plan=planEnemy(e,simState(),maze,occ);
    for(const a of plan.acts){
      if(S.over||!e.alive)break;
      const k=K(a.c,a.r);
      if(a.t==='atk'){hitPlayer(e);render();await sleep(STEP*2);break}
      if(a.t==='wall'){const w=S.walls[k];if(w){w.hp--;chips(a.c,a.r,w.kind==='wood'?'#bf7f45':'#a69d8c');if(w.hp<=0){delete S.walls[k];log(`${w.kind==='wood'?'통나무':'성벽'}이 무너졌습니다`)}}render();await sleep(STEP);continue}
      if(a.t==='brk'){S.trail[k]=Math.max(0,(S.trail[k]||0)-1);chips(a.c,a.r,'#5b9a45');
        if(S.trail[k]===0){delete S.trail[k];S.terr[k]='road'}render();await sleep(STEP);continue}
      e.c=a.c;e.r=a.r;e.lastDir=a.dir;render();await sleep(STEP);
      if(S.traps[k]){delete S.traps[k];
        if(e.type==='scout'){e.stun=2;e.hp--;fx(e.c,e.r,'stunfx');floatText(e.c,e.r,'-1','ally');log('정탐병이 덫에 걸렸습니다 (피해 1, 2턴 묶임)');if(e.hp<=0)kill(e,'덫')}
        else kill(e,'덫');
        render();break}
      if(towersReact(e)){render();await sleep(STEP);break}
    }
    if(S.over)return;
  }
}
function spawnPoint(){
  const cf=cellField(),scs=aliveScouts();
  let sd=0;for(const s of scs)sd=Math.max(sd,cf.get(K(s.c,s.r))??0);
  const target=sd+4;let best=null,bd=1e9;
  for(const [k,d] of cf){if(S.terr[k]!=='road'||S.walls[k])continue;const [c,r]=k.split(',').map(Number);if(enemyAt(c,r))continue;const sc=Math.abs(d-target)+(d<sd?50:0);if(sc<bd){bd=sc;best={c,r}}}
  return best||{c:0,r:3};
}
// a new scout cuts across the forest and joins the trail somewhere behind the player
function flankPoint(){
  const cf=cellField(),P=S.player;let best=null,bd=1e9;
  for(const [k,d] of cf){
    if(d<6||S.walls[k]||S.traps[k])continue;const [c,r]=k.split(',').map(Number);if(enemyAt(c,r))continue;
    const sc=Math.abs(d-8)+(S.trail[k]>0?0:1.5);if(sc<bd){bd=sc;best={c,r}}
  }
  return best||spawnPoint();
}
function postEnemy(){
  if(S.goal.type!=='gap')return;
  // scouts: at most scoutMax per stage, scoutConcurrent at once, announced one turn early
  for(const p of S.scoutPlan){
    if(p.done)continue;
    if(S.scoutsUsed>=RULES.scoutMax){p.done=true;continue}
    if(S.turn+1>=p.turn&&!p.pos){p.pos=flankPoint();log('숲 속에서 정탐병이 합류하려 합니다 (붉은 ! 표시)')}
    if(S.turn>=p.turn&&p.pos){
      if(aliveScouts().length>=RULES.scoutConcurrent)continue;
      if(!isGraph(p.pos.c,p.pos.r)||enemyAt(p.pos.c,p.pos.r)||(p.pos.c===S.player.c&&p.pos.r===S.player.r)){p.pos=flankPoint();continue}
      addEnemy(S,'scout',p.pos.c,p.pos.r);p.done=true;fx(p.pos.c,p.pos.r,'spawn');
      log(`정탐병 합류! (투입 ${S.scoutsUsed}/${RULES.scoutMax})`);banner('정탐병 합류','');
    }
  }
  S.scoutPlan=S.scoutPlan.filter(p=>!p.done);
  // waves: exactly defWaves per stage, they march on the scouts' road
  const W=S.goal.waves;
  if(S.waveSpawned<W&&S.turn>=S.nextWaveTurn&&S.spawnQ.length===0){
    const tpl=S.waves[Math.min(S.waveSpawned,S.waves.length-1)];
    S.waveSpawned++;S.spawnQ=tpl.map(t=>({type:t,wave:S.waveSpawned}));
    S.waveInfo[S.waveSpawned]={retreat:null,done:false};
    S.nextWaveTurn=S.turn+tpl.length+S.cfg.waveGap+2*lv('beacon');
    log(`웨이브 ${S.waveSpawned}/${W} 진군! 정탐병이 낸 길로 ${tpl.length}명이 옵니다`);banner(`웨이브 ${S.waveSpawned} 진군`,'');
  }
  if(S.spawnQ.length){const p=spawnPoint();if(p&&!enemyAt(p.c,p.r)){const s=S.spawnQ.shift();addEnemy(S,s.type,p.c,p.r,s.wave);fx(p.c,p.r,'spawn')}}
  for(let w=1;w<=S.waveSpawned;w++){
    const info=S.waveInfo[w];if(info.done||S.spawnQ.some(s=>s.wave===w))continue;
    if(info.retreat===null)info.retreat=S.turn+RULES.waveRetreat;
    const alive=S.enemies.filter(e=>e.alive&&e.wave===w);
    if(!alive.length){info.done=true;S.blocked++;log(`웨이브 ${w} 전멸 · 저지 성공 (${S.blocked}/${W})`);banner(`웨이브 ${w} 저지`,'blue')}
    else if(S.turn>=info.retreat){alive.forEach(e=>{e.alive=false});info.done=true;S.blocked++;log(`웨이브 ${w} 퇴각 · 버텨서 저지 성공 (${S.blocked}/${W})`);banner(`웨이브 ${w} 퇴각`,'blue')}
  }
}
// gap = trail distance to the nearest active scout (null when none are on the field)
function gapInfo(){
  const sc=aliveScouts();if(!sc.length)return {gap:null};
  const cf=cellField();let g=Infinity;for(const s of sc)g=Math.min(g,cf.get(K(s.c,s.r))??Infinity);
  return {gap:g};
}
async function endTurn(){
  if(busy||!S||S.over||!modal.hidden)return;
  busy=true;place=null;render();
  if(smokeArmed){S.items.smoke--;smokeArmed=false;log('연막! 추격대가 이번 턴 움직이지 못했습니다');banner('연막','gold')}
  else{$('#turnpill').hidden=false;await enemyPhase();$('#turnpill').hidden=true}
  if(S.over){busy=false;render();return}
  postEnemy();
  if(S.goal.type==='gap'){
    const g=gapInfo().gap,pending=S.scoutPlan.length>0&&S.scoutsUsed<RULES.scoutMax;
    if(g===null&&!pending){busy=false;win('rout');return}
    if(g!==null&&g>=S.goal.gap){busy=false;win('gap');return}
    if(S.blocked>=S.goal.waves&&(g===null||g>=S.goal.def)){busy=false;win('def');return}
  }
  S.turn++;if(run&&S.useTraits)run.turns++;
  if(S.goal.maxTurns&&S.turn>S.goal.maxTurns){busy=false;lose('제한 턴 안에 도착하지 못했습니다');return}
  if(S.useTraits){
    if(S.buildOpen){const g=gapInfo().gap;if(g===null||g>=RULES.buildGap){const add=RULES.supplyPerTurn+lv('supply');S.supply+=add;floatText(S.player.c,S.player.r,`자재 +${add}`,'gold')}}
  }
  S.ap=moveMax(S);busy=false;render();checkOpen();takeSnap(S);
}

/* ================= WIN / LOSE ================= */
function win(reason){
  S.over=true;render();
  setTimeout(()=>{
    if(S.id==='t1'||S.id==='t2'){
      const first=!meta[S.id];meta[S.id]=true;saveMeta();
      const nextBtn=S.id==='t1'?`<button class="btn primary" data-go="t2" type="button">튜토리얼 2로</button>`:`<button class="btn primary" data-go="run" type="button">3스테이지 시작</button>`;
      showCard(`<div class="eyebrow">${S.name} 클리어</div><h2>${S.id==='t1'?'발자국이 남았습니다':'정탐병을 따돌렸습니다'}</h2>

    const head=reason==='def'?'옹립 세력이 길을 막아냈습니다':reason==='rout'?'추격대가 와해되었습니다':'왕손은 숲 깊이 사라졌습니다';
    const body=reason==='def'?`간격 ${RULES.defGap}칸 이상을 지킨 채 웨이브 ${RULES.defWaves}개를 막았습니다.`:reason==='rout'?`정탐병 ${RULES.scoutMax}명을 모두 쓰러뜨려 추격이 끊겼습니다.`:`정탐병과의 간격을 ${RULES.winGap}칸 벌렸습니다.`;
    showCard(`<div class="eyebrow">${cleared}스테이지 클리어</div><h2>${head}</h2>
      <p>${body} 특성 포인트 <b>+1</b>.</p>

function lose(why){

const modal=$('#modal'),card=$('#card');
function showCard(html,wide){card.className='card'+(wide?' wide':'');card.innerHTML=html;modal.hidden=false;const f=card.querySelector('.primary')||card.querySelector('button');f&&f.focus()}
function hideCard(){modal.hidden=true}
card.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b||b.disabled)return;go(b.dataset.go)});
function go(where){
  if(where==='menu')return showMenu();
  if(where==='rules')return showRules();
  if(where==='t1'||where==='t2')return startStage(where);
  if(where==='run'){newRun();traitTab='A';return run.points>0?showTraits():startStage(run.stage)}
  if(where==='continue')return run?(S&&S.useTraits&&!S.over?hideCard():startStage(run.stage)):showMenu();
  if(where==='traits')return showTraits();
  if(where==='play')return startStage(run.stage);
  if(where==='close')return hideCard();
  if(where.startsWith('tab:')){traitTab=where.slice(4);return showTraits()}
  if(where.startsWith('buy:')){const id=where.slice(4),t=TRAITS.find(x=>x.id===id),l=rlv(id);if(run&&l<t.max&&run.points>=t.cost){run.points-=t.cost;run.traits[id]=l+1}return showTraits()}
}

/* ================= ART ================= */
// Everything visual is defined once as <symbol>s in the board's <defs> and placed with <use>.
// Characters share one SD-chibi rig (2-head proportion, glossy anime eyes, cel shading, warm outline).
const OL='#3a2925';
const IRIS={gold:['#ffe385','#c47a0a'],red:['#ff9f8f','#a3161f'],blue:['#aedbff','#2a5ea8'],brown:['#e3b27a','#5c3417'],green:['#b6eaa2','#2d7a3b'],dark:['#a0a6bd','#272b3c'],violet:['#d2b6ff','#5a399e']};
function rngArt(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1=n=>Math.round(n*10)/10;

function chEyes(o,sk){
  let s='';const g=`url(#ir-${o.iris||'brown'})`;
  for(const [cx,side] of [[25.2,-1],[38.8,1]]){
    s+=`<ellipse cx="${cx}" cy="35.6" rx="4.6" ry="5.4" fill="#fff"/>`;
    s+=`<ellipse cx="${cx}" cy="36.2" rx="3.8" ry="4.8" fill="${g}"/>`;
    s+=`<ellipse cx="${cx}" cy="36.9" rx="1.9" ry="2.6" fill="#1a1220"/>`;
    s+=`<circle cx="${f1(cx-1.5)}" cy="34.1" r="1.6" fill="#fff"/><circle cx="${f1(cx+1.6)}" cy="38.7" r=".85" fill="#fff" opacity=".9"/>`;
    const ix=f1(cx-side*5.4),ox=f1(cx+side*5.4);
    if(o.eye==='sharp'){
      s+=`<path d="M${ox} 28.2 L${ix} 28.2 L${ix} 34.4 L${ox} 31.2 Z" fill="${sk}"/>`;
      s+=`<path d="M${ox} 31.2 L${ix} 34.4" stroke="#1a1220" stroke-width="2.2" stroke-linecap="round"/>`;
    }else if(o.eye==='calm'){
      s+=`<path d="M${f1(cx-5.4)} 28.2 L${f1(cx+5.4)} 28.2 L${f1(cx+5.4)} 33 L${f1(cx-5.4)} 33 Z" fill="${sk}"/>`;
      s+=`<path d="M${f1(cx-5)} 33.2 Q${cx} 32 ${f1(cx+5)} 33.2" stroke="#1a1220" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    }else{
      s+=`<path d="M${f1(cx-5.1)} 32.6 Q${cx} 29.2 ${f1(cx+5.1)} 32.8" stroke="#1a1220" stroke-width="2.1" fill="none" stroke-linecap="round"/>`;
      if(o.fem)s+=`<path d="M${f1(cx+side*5)} 32.7 l${side*2.2} -1.8" stroke="#1a1220" stroke-width="1.6" stroke-linecap="round"/>`;
    }
    s+=`<path d="M${f1(cx-3)} 41 Q${cx} 41.8 ${f1(cx+3)} 41" stroke="#1a1220" stroke-width=".7" fill="none" opacity=".35"/>`;
  }
  return s;
}
function chMouth(m){
  switch(m){
    case 'o':return `<ellipse cx="32" cy="44.4" rx="1.9" ry="2.2" fill="#8a2a33" stroke="#4a1a1e" stroke-width=".8"/>`;
    case 'smile':return `<path d="M29 43.2 Q32 46.4 35 43.2" stroke="#5a2a24" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;

function clumps(list,fill,outline,w){
  let s='';
  if(outline)s+=list.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${outline}" stroke="${outline}" stroke-width="${w*2}"/>`).join('');
  return s+list.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
}
function clumpsE(list,fill,outline,w){
  let s='';
  if(outline)s+=list.map(([x,y,a,b])=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${outline}" stroke="${outline}" stroke-width="${w*2}"/>`).join('');
  return s+list.map(([x,y,a,b])=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${fill}"/>`).join('');
}

function computePreview(){

  const order=S.enemies.filter(e=>e.alive).sort((a,b)=>(cf.get(K(a.c,a.r))??999)-(cf.get(K(b.c,b.r))??999));
  const pos=new Map(order.map(e=>[e.id,K(e.c,e.r)])),res=[];let hit=false;

}

    $('#mPred').innerHTML=warn||(pv&&!pv.smoke&&g!==null?`<span class="muted">추격대 이동 후 <b>${pg}</b>칸</span>`:'');
    const gv=g===null?G:g,pv2=g===null?G:pg;
    fill.style.width=Math.min(100,100*pv2/G)+'%';ghost.style.width=Math.min(100,100*gv/G)+'%';
    tick.hidden=false;tick.style.left=(100*S.goal.def/G)+'%';
    const aliveW=S.enemies.filter(e=>e.alive&&e.wave).length+S.spawnQ.length;
    let st;const act=Object.entries(S.waveInfo).find(([,i])=>!i.done);
    if(act){const [w,i]=act;st=i.retreat===null?`웨이브 ${w} 진군 중`:`웨이브 ${w} 퇴각까지 <b>${Math.max(0,i.retreat-S.turn)}</b>턴`}
    else if(S.waveSpawned<S.goal.waves)st=`다음 웨이브 ${Math.max(0,S.nextWaveTurn-S.turn)}턴 후`;else st='모든 웨이브 종료';
    const sc=aliveScouts().length;
    $('#mSub').innerHTML=`정탐병 활동 <b>${sc}</b>/${RULES.scoutConcurrent} · 남은 투입 ${RULES.scoutMax-S.scoutsUsed} · 웨이브 저지 <b>${S.blocked}</b>/${S.goal.waves} · ${st} · 병사 ${aliveW} · 붉은 눈금 = 옹립 세력 ${RULES.buildGap}칸`;
  }
  const dis=busy||S.over;
  if(S.useTraits){
    $('#itemBtns').innerHTML=`<span class="glabel a">충신의 도구</span>`+ITEMS.map(i=>`<button class="btn ${place===i.id||(i.id==='smoke'&&smokeArmed)?'on':''}" data-item="${i.id}" type="button" ${S.items[i.id]>0&&!dis?'':'disabled'}>${i.name} <span class="n">${S.items[i.id]}</span> <kbd>${i.key}</kbd></button>`).join('');
    const ok=canBuildNow();
    $('#buildBtns').innerHTML=`<span class="glabel b">${S.buildOpen?(ok?`옹립 세력 · 자재 ${S.supply}`:`옹립 세력 · 간격 ${RULES.buildGap}칸 필요`):`옹립 세력 · 간격 ${RULES.buildGap}칸에 합류`}</span>`+BUILDS.map(b=>`<button class="btn build ${place===b.id?'on':''}" data-item="${b.id}" type="button" ${ok&&S.supply>=RULES.cost[b.id]&&!dis?'':'disabled'}>${b.name} <span class="cost">${RULES.cost[b.id]}</span> <kbd>${b.key}</kbd></button>`).join('');
  }else{$('#itemBtns').innerHTML='';$('#buildBtns').innerHTML=''}
  $('#undoBtn').disabled=dis;$('#endBtn').disabled=dis;
  $('#endTxt').textContent=busy?'추격대의 턴…':'턴 종료';
}
function renderLegend(){
  const types=new Set(['scout']);if(S.useTraits)S.waves.flat().forEach(t=>types.add(t));
  let h=`<div class="lg">${fig('ch-hero')}<div><b>왕손 휘</b>폐위되어 평민으로 살던 왕족. 한 턴 ${moveMax(S)}칸, 지나간 칸에 흔적을 남깁니다.</div></div>`;
  if(S.id!=='t1')for(const t of types)h+=`<div class="lg">${fig('ch-'+t)}<div><b>${EDEF[t].name}</b>${EDEF[t].desc}</div></div>`;
  if(S.useTraits){
    h+=`<div class="lg">${fig('ch-aspear')}<div><b>충신 병사</b>창병 십자 1칸, 궁수 십자 2칸. 무적, 길이 아닌 칸에만 배치.</div></div>`;
    h+=`<div class="lg"><svg viewBox="0 0 64 96" aria-hidden="true"><use href="#tw" width="64" height="96"/></svg><div><b>망루 · 성벽</b>옹립 세력이 짓습니다. 망루는 십자 2칸 사격, 성벽은 길을 막고 적의 사선을 가립니다.</div></div>`;
  }
  $('#legend').innerHTML=h;
}
function renderLog(){$('#log').innerHTML=S?S.log.slice(0,12).map(m=>`<li>${m}</li>`).join(''):''}
function render(instant){
  if(!S)return;
  updateCam(instant);
  liveGap=S.goal.type==='gap'?gapInfo().gap:null;
  preview=computePreview();
  renderTerrain();renderMarks();renderEnts();renderHud();renderLegend();renderLog();renderHover();
}
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}

/* ================= INPUT ================= */
let hoverCell=null;
function cellFromEvent(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM();if(!m)return null;const loc=pt.matrixTransform(m.inverse());return {c:Math.floor((loc.x+camX*CELL)/CELL),r:Math.floor(loc.y/CELL)}}
function renderHover(){
  const g=$('#hover');if(!hoverCell||!S||busy||S.over){g.innerHTML='';return}
  const {c,r}=hoverCell,P=S.player;let cls=null,extra='';
  if(place&&place!=='smoke'){cls=canPlace(place,c,r)?'hov':'hov bad';
    if(['spear','archer','tower'].includes(place)&&canPlace(place,c,r)){const rg=place==='spear'?1:2;for(const [dx,dy] of DIRS)for(let i=1;i<=rg;i++){const cc=c+dx*i,rr=r+dy*i;if(terr(cc,rr)===null||terr(cc,rr)==='rock')break;extra+=`<rect x="${cc*CELL+4}" y="${rr*CELL+4}" width="${CELL-8}" height="${CELL-8}" rx="8" class="rng"/>`}}}
  else if(Math.abs(c-P.c)+Math.abs(r-P.r)===1)cls='hov';
  else{const k=K(c,r),u=S.units[k];if(u){const rg=u.range;for(const [dx,dy] of DIRS)for(let i=1;i<=rg;i++){const cc=c+dx*i,rr=r+dy*i;if(terr(cc,rr)===null||terr(cc,rr)==='rock')break;extra+=`<rect x="${cc*CELL+4}" y="${rr*CELL+4}" width="${CELL-8}" height="${CELL-8}" rx="8" class="rng"/>`}}}
  g.innerHTML=extra+(cls?`<rect x="${c*CELL+2}" y="${r*CELL+2}" width="${CELL-4}" height="${CELL-4}" rx="9" class="${cls}"/>`:'');
}
svg.addEventListener('pointermove',ev=>{if(ev.pointerType!=='mouse')return;const cc=cellFromEvent(ev);if(!cc)return;if(!hoverCell||cc.c!==hoverCell.c||cc.r!==hoverCell.r){hoverCell=cc;renderHover()}});
svg.addEventListener('pointerleave',()=>{hoverCell=null;renderHover()});
svg.addEventListener('click',ev=>{
  if(!S||busy||S.over)return;const cc=cellFromEvent(ev);if(!cc)return;const {c,r}=cc;
  if(place&&place!=='smoke'){doPlace(c,r);return}
  const P=S.player,dc=c-P.c,dr=r-P.r;
  if(Math.abs(dc)+Math.abs(dr)===1)tryStep(DIRS.findIndex(d=>d[0]===dc&&d[1]===dr));
});
document.addEventListener('keydown',ev=>{
  if(!modal.hidden){if(ev.key==='Escape'&&S&&!S.over&&!S.demo)hideCard();return}
  if(!S)return;
  const map={ArrowRight:0,d:0,D:0,ArrowDown:1,s:1,S:1,ArrowLeft:2,a:2,A:2,ArrowUp:3,w:3,W:3};
  if(ev.key in map){ev.preventDefault();tryStep(map[ev.key]);return}
  if(ev.key===' '||ev.key==='Enter'){if(ev.key==='Enter'&&ev.target.closest&&ev.target.closest('button'))return;ev.preventDefault();endTurn();return}
  if(ev.key==='z'||ev.key==='Z'||ev.key==='Backspace'){ev.preventDefault();undo();return}
  if(ev.key==='Escape'){place=null;smokeArmed=false;render();return}
  const it=[...ITEMS,...BUILDS].find(i=>i.key===ev.key);if(it)selectItem(it.id);
});
document.querySelector('.tray').addEventListener('click',e=>{const b=e.target.closest('[data-item]');if(b)selectItem(b.dataset.item)});
$('#endBtn').addEventListener('click',endTurn);
$('#undoBtn').addEventListener('click',undo);
$('#menuBtn').addEventListener('click',showMenu);
$('#rulesBtn').addEventListener('click',showRules);
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(resize,120)});

/* ================= BOOT ================= */
$('#defs').innerHTML=buildDefs();
if(!RM){const p=$('#petals');let h='';for(let i=0;i<9;i++)h+=`<i style="left:${8+i*11}%;animation-duration:${9+i%4*3}s;animation-delay:-${i*1.7}s"></i>`;p.innerHTML=h}
// a live stage sits behind the menu so the first frame shows the game
newRun();run.points=0;S=makeStage(3);run=null;S.useTraits=false;S.demo=true;
S.log=['메뉴에서 튜토리얼이나 런을 시작하세요'];
resize();
showMenu();
window.__game={get S(){return S},get run(){return run},tryStep,endTurn,startStage,go,undo,selectItem,doPlace};
})();
</script>
</body>
